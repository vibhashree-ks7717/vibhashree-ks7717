<svg width="900" height="90" viewBox="0 0 900 90" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="sparkle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#f0abfc"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Soft flowing trail -->
  <path
    d="M40 45 C220 15, 300 75, 450 45 S680 15, 860 45"
    fill="none"
    stroke="url(#sparkle)"
    stroke-width="1.5"
    opacity="0.35"
  />

  <!-- Moving sparkle 1 -->
  <g filter="url(#glow)">
    <text x="0" y="50" font-size="22" fill="#e9d5ff">✦</text>

    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0; 300 -12; 410 0; 450 0; 500 0; 600 12; 900 0"
      dur="7s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="opacity"
      values="0;1;1;1;1;1;0"
      dur="7s"
      repeatCount="indefinite"
    />
  </g>

  <!-- Moving sparkle 2 -->
  <g filter="url(#glow)">
    <text x="0" y="50" font-size="15" fill="#c084fc">✧</text>

    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0; 250 10; 390 -5; 450 0; 500 5; 650 -10; 900 0"
      dur="7s"
      begin="0.8s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="opacity"
      values="0;1;1;1;1;1;0"
      dur="7s"
      begin="0.8s"
      repeatCount="indefinite"
    />
  </g>

  <!-- Moving sparkle 3 -->
  <g filter="url(#glow)">
    <text x="0" y="50" font-size="12" fill="#f5d0fe">✦</text>

    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0; 200 -8; 370 8; 450 0; 530 -8; 700 8; 900 0"
      dur="7s"
      begin="1.6s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="opacity"
      values="0;1;1;1;1;1;0"
      dur="7s"
      begin="1.6s"
      repeatCount="indefinite"
    />
  </g>

  <!-- Central magical sparkle -->
  <g transform="translate(450 45)" filter="url(#glow)">
    <text
      x="0"
      y="0"
      text-anchor="middle"
      dominant-baseline="middle"
      font-size="28"
      fill="#f5d0fe"
    >✦</text>

    <animate
      attributeName="opacity"
      values="0.4;1;1;0.5;0.4"
      dur="7s"
      repeatCount="indefinite"
    />

    <animateTransform
      attributeName="transform"
      type="scale"
      values="1;1.35;1.35;1;1"
      dur="7s"
      repeatCount="indefinite"
      additive="replace"
    />
  </g>

  <!-- Tiny stars -->
  <g fill="#ddd6fe" filter="url(#glow)">
    <circle cx="160" cy="32" r="1.5">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
    </circle>

    <circle cx="270" cy="62" r="1.2">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>

    <circle cx="630" cy="30" r="1.4">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/>
    </circle>

    <circle cx="750" cy="62" r="1.3">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

</svg>
